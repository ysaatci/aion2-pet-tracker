name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test tests/AionMeter.Tests -c Release
      - name: Build the app
        run: dotnet build src/AionMeter.App -c Release
