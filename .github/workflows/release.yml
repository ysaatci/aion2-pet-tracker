# Builds a release from a version tag (bump <Version> in src/AionMeter.App/AionMeter.App.csproj, then
# git tag vX.Y.Z && git push origin vX.Y.Z) and leaves it as a DRAFT release to check and publish by hand.
#
# Code signing (optional) through SignPath Foundation: once the repository variable SIGNPATH_ORGANIZATION_ID is set,
# the exe is signed before it goes into the installer, then the installer is signed; each signing request waits
# for a release approver in SignPath. Needs: secret SIGNPATH_API_TOKEN; variables SIGNPATH_ORGANIZATION_ID,
# SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG, SIGNPATH_EXE_CONFIGURATION_SLUG and
# SIGNPATH_INSTALLER_CONFIGURATION_SLUG (the files in .signpath/). Without them the release is unsigned.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the draft release
  actions: read     # SignPath downloads the unsigned artifacts

jobs:
  release:
    runs-on: windows-latest
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/AionMeter.Tests -c Release

      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          $version = (Select-Xml -Path src/AionMeter.App/AionMeter.App.csproj -XPath "//Version").Node.InnerText
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match <Version>$version</Version>" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build the exe
        shell: pwsh
        run: ./build-release.ps1 -Stage exe

      # ---- sign the exe (it goes into the installer and the portable zip)
      - name: Upload the unsigned exe
        if: env.SIGN == 'true'
        id: unsigned-exe
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exe
          path: dist/AION2PetTracker.exe
          if-no-files-found: error
      - name: Sign the exe
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXE_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-exe
      - name: Use the signed exe
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature signed-exe/AION2PetTracker.exe
          if ($sig.Status -ne 'Valid') { throw "Signed exe does not verify: $($sig.Status) $($sig.StatusMessage)" }
          Copy-Item signed-exe/AION2PetTracker.exe dist/AION2PetTracker.exe -Force

      - name: Build the installer and archives
        shell: pwsh
        run: |
          ./build-release.ps1 -Stage installer
          ./build-release.ps1 -Stage archives

      # ---- sign the installer
      - name: Upload the unsigned installer
        if: env.SIGN == 'true'
        id: unsigned-setup
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-setup
          path: dist/AION2PetTracker-Setup-v${{ env.VERSION }}.exe
          if-no-files-found: error
      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-setup
      - name: Use the signed installer
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $setup = "AION2PetTracker-Setup-v$env:VERSION.exe"
          $sig = Get-AuthenticodeSignature "signed-setup/$setup"
          if ($sig.Status -ne 'Valid') { throw "Signed installer does not verify: $($sig.Status) $($sig.StatusMessage)" }
          Copy-Item "signed-setup/$setup" "dist/$setup" -Force

      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $title = "AION2 Pet Tracker $env:VERSION" + $(if ($env:SIGN -ne 'true') { ' (unsigned)' })
          gh release create "${{ github.ref_name }}" --draft --generate-notes --title $title `
            "dist/AION2PetTracker-Setup-v$env:VERSION.exe" dist/AION2PetTracker.exe `
            "dist/AION2PetTracker-v$env:VERSION-win-x64.zip" "dist/AION2PetTracker-v$env:VERSION-source.zip"
