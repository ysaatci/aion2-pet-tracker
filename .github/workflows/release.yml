# Builds a release from a version tag (bump <Version> in src/AionMeter.App/AionMeter.App.csproj, then
# git tag vX.Y.Z && git push origin vX.Y.Z) and leaves it as a DRAFT release to check and publish by hand.
# Installed copies pick up a published release by themselves: they look for the "Setup" exe among its files.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the draft release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/AionMeter.Tests -c Release

      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          $version = (Select-Xml -Path src/AionMeter.App/AionMeter.App.csproj -XPath "//Version").Node.InnerText
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match <Version>$version</Version>" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build
        shell: pwsh
        run: ./build-release.ps1

      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --draft --generate-notes --title "AION2 Pet Tracker $env:VERSION" `
            "dist/AION2PetTracker-Setup-v$env:VERSION.exe" dist/AION2PetTracker.exe `
            "dist/AION2PetTracker-v$env:VERSION-win-x64.zip" "dist/AION2PetTracker-v$env:VERSION-source.zip"
